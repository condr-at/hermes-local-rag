<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Local RAG memory drawer</title>
  <desc id="desc">A dark archive drawer holding an ivory memory card, with an amber node mark and a rejected crumpled note.</desc>
  <defs>
