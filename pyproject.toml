[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hermes-local-rag"
version = "1.4.0"
description = "Private local hybrid text and visual memory provider for Hermes Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "condr-at"}]
dependencies = [
  "numpy>=2.0,<3",
  "tokenizers>=0.22,<1",
  "Pillow>=11,<13",
  "onnxruntime>=1.20,<2",
  "ai-edge-litert>=2.1,<3; platform_system == 'Darwin' or platform_system == 'Linux'",
  "huggingface-hub>=0.34,<2",
  "jsonschema>=4,<5",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/condr-at/hermes-local-rag"
Issues = "https://github.com/condr-at/hermes-local-rag/issues"

[project.scripts]
hermes-local-rag = "local_rag.cli:main"
hermes-local-rag-inference = "local_rag.inference:main"
hermes-local-rag-backfill = "local_rag.cli:backfill_main"

[project.entry-points."hermes_agent.memory_providers"]
local_rag = "local_rag:register"

[dependency-groups]
dev = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "pytest>=9,<10"]

[tool.hatch.build]
exclude = ["local_rag/provider 2.py", "evaluation/**", "**/*.db", "**/*.db-*", "**/*.sqlite*", "**/*.zip", "**/*.jsonl", ".env*"]

[tool.hatch.build.targets.wheel]
packages = ["local_rag"]

[tool.pytest.ini_options]
testpaths = ["local_rag/tests"]
addopts = "-q"
